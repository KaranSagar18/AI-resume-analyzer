{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Create Account</h2>
        <p class="sub-text">Use our AI powered Resume Analyzer to get feedback on your resume</p>
        
        {% if error %}
            <p style="color: red; font-size: 14px;">{{ error }}</p>
        {% endif %}

        <form method="post">
            <input type="email" name="email" placeholder="Enter your email" required>
            <input type="password" name="password" placeholder="Create your password" required minlength="6">
            <p class="sub-text">Use at least 6 characters</p>
            <button type="submit">Sign Up</button>
        </form>
        <p class="switch-auth">Already have an account? <a href="/login">Login</a></p>
    </div>
</div>
{% endblock %}
